<style>

  background-image: url("images/catalogue background.jpg");

  background-position: center;
  background-repeat: no-repeat;
  color: black;
}

/* Contact Box */
.contact-box {
  background: white;
  padding: 20px;
  margin: 50px auto;
  width: 300px;
  border-radius: 15px;
  box-shadow: 0 0 10px pink;
  text-align: center;
}

/* Navigation */
nav {
  text-align: center;
  padding: 15px;
}

nav a {
  text-decoration: none;
  color: black;
  font-weight: bold;
  margin: 0 15px;
  font-size: 18px;
}

nav a:hover {
  color: #ff1493;
}

/* Map */
.map-container {
  width: 80%;
  margin: 40px auto;
  border-radius: 15px;
  overflow: hidden;
}
</style>
</head>

<nav>
